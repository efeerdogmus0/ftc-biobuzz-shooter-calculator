name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Full suite, files run serially: the heavy physics tests are CPU-bound and
      # their timeouts were set for an unloaded machine. Nothing is skipped.
      - run: npm run test:ci
      - run: npm run build
